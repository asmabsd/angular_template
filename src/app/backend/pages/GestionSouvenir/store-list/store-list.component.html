<!-- Essayez avec un chemin absolu -->


<div class="table-container">
    <div class="mb-3">
      <button class="btn btn-success" [routerLink]="['/dashboard/addStore']">
        <i class="fas fa-plus me-2"></i>  +Add a Store
      </button>
    </div>
    
    <div class="table-responsive">
      <table class="table table-striped table-hover custom-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>address</th>
            <th>description</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let store of stores">
            <td>{{ store.id }}</td>
            <td>{{ store.name }}</td>
            <td>{{ store.address }}</td>
            <td>{{ store.description }}</td>
            <td>+216 {{ store.phone | phoneFormat}}</td>
            <td>
              <button class="btn-action btn-edit" [routerLink]="['/dashboard/editStore', store.id]">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn-action btn-view" [routerLink]="['/dashboard/viewStore', store.id]">
                <i class="fas fa-eye"></i> View
              </button>
              <button class="btn-action btn-delete" (click)="deletestore(store.id)">
                <i class="fas fa-trash"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
