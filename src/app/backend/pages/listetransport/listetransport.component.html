<div class="table-container">
  <div class="mb-3 d-flex justify-content-between flex-wrap gap-2">
    <!-- Bouton Ajouter Transport -->
    <button class="btn btn-success" [routerLink]="['/dashboard/addtransport']">
      <i class="fas fa-plus me-2"></i> +Ajouter un Transport
    </button>

    <!-- Bouton Ajouter Réservation Transport -->
    <button class="btn btn-info" [routerLink]="['/dashboard/addreservationtransport']">
      <i class="fas fa-ticket-alt me-2"></i> +Ajouter une Réservation
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover custom-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Type</th>
          <th>Disponibilité</th>
          <th>Localisation</th>
          <th>Description</th>
          <th>Capacité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let transport of transports">
          <td>{{ transport.id }}</td>
          <td>{{ transport.type }}</td>
          <td>{{ transport.disponibilite }}</td>
          <td>{{ transport.location }}</td>
          <td>{{ transport.description }}</td>
          <td>{{ transport.capacity }}</td>
          <td>
            <button class="btn-action btn-edit" [routerLink]="['/dashboard/edittransport', transport.id]">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn-action btn-delete" (click)="deleteTransport(transport.id)">
              <i class="fas fa-trash"></i> Delete
            </button>
            <button class="btn-action btn-view" [routerLink]="['/dashboard/detailstransport', transport.id]">
              <i class="fas fa-eye"></i> View
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
