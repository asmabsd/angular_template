<form [formGroup]="transportForm" (ngSubmit)="onSubmit()" class="card p-4 shadow-sm rounded bg-light">
  <h3 class="mb-4 text-primary text-center">Modifier Transport</h3>

  <!-- Type -->
  <div class="mb-3">
    <label for="type" class="form-label fw-bold">🚗 Type de transport</label>
    <input id="type" class="form-control" placeholder="Ex: Bus, Taxi..." formControlName="type" />
  </div>

  <!-- Disponibilité (ligne séparée) -->
  <div class="mb-3">
    <label for="disponibilite" class="form-label fw-bold">📅 Disponibilité</label>
    <select id="disponibilite" class="form-select" formControlName="disponibilite">
      <option disabled value="">Sélectionner la disponibilité</option>
      <option value="Disponible">✅ Disponible</option>
      <option value="Indisponible">❌ Indisponible</option>
    </select>
  </div>

  <!-- Localisation (ligne séparée) -->
  <div class="mb-3">
    <label for="location" class="form-label fw-bold">📍 Localisation</label>
    <select id="location" class="form-select" formControlName="location">
      <option disabled value="">Sélectionner une région</option>
      <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
    </select>
  </div>

  <!-- Description -->
  <div class="mb-3">
    <label for="description" class="form-label fw-bold">📝 Description</label>
    <textarea
      id="description"
      class="form-control description-box"
      placeholder="Ajouter une description du transport..."
      formControlName="description"
      rows="4"
    ></textarea>
  </div>

  <!-- Capacité -->
  <div class="mb-3">
    <label for="capacity" class="form-label fw-bold">👥 Capacité</label>
    <input type="number" id="capacity" class="form-control" formControlName="capacity" />
  </div>

  <!-- Boutons -->
  <div class="d-flex justify-content-between mt-4">
    <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Retour</button>
    <button type="submit" class="btn btn-primary" [disabled]="transportForm.invalid">💾 Enregistrer</button>
  </div>
</form>
