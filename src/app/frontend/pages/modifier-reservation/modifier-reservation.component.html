<div *ngIf="reservation" class="reservation-container">
    <div class="card">
      <div class="card-content">
        <h2 class="title">✏️ Edit Reservation </h2>
  
        <form (ngSubmit)="modifierReservation()" #reservationForm="ngForm">
          <div class="form-group">
            <label for="dateDebut">📅 Start Date:</label>
            <input 
              type="date" 
              id="dateDebut" 
              name="dateDebut" 
              [(ngModel)]="reservation.dateDebut" 
              [min]="today" 
              (change)="calculerPrixTotal()" 
              required />
          </div>
  
          <div class="form-group">
            <label for="dateFin">📅 End Date:</label>
            <input 
              type="date" 
              id="dateFin" 
              name="dateFin" 
              [(ngModel)]="reservation.dateFin" 
              [min]="today" 
              (change)="calculerPrixTotal()" 
              required />
          </div>
  
          <div class="form-group">
            <label for="nombreadulte">🧑 Adults:</label>
            <input 
              type="number" 
              id="nombreadulte" 
              name="nombreadulte" 
              [(ngModel)]="reservation.nombreadulte" 
              (input)="calculerPrixTotal()" 
              min="0" 
              required />
          </div>
  
          <div class="form-group">
            <label for="nombrenfant">🧒 Children:</label>
            <input 
              type="number" 
              id="nombrenfant" 
              name="nombrenfant" 
              [(ngModel)]="reservation.nombrenfant" 
              (input)="calculerPrixTotal()" 
              min="0" 
              required />
          </div>
          <div class="form-group">
          <label for="clientEmail">📧 Email:</label>
          <input 
            type="email" 
            id="clientEmail" 
            name="clientEmail" 
            [(ngModel)]="reservation.clientEmail" 
            
            required
            placeholder="Votre email pour la confirmation">
        </div>
          <div class="form-group">
            <label for="statut">👤 Status:</label>
            <select id="statut" name="statut" [(ngModel)]="reservation.statut" required>
              <option value="marié">Couple</option>
              <option value="célibataire">Single</option>
              <option value="famille">Family</option>
            </select>
          </div>
  <!-- Nombre de chambres -->
<div class="form-group">
  <label for="nombreChambres">🛏️ Number of Rooms:</label>
<input
  type="number"
  id="nombreChambres"
  name="nombreChambres"
  [(ngModel)]="reservation.nombreChambres"
  (input)="calculerPrixTotal()"  
  min="1"
  required />

</div>

<!-- Type de chambre -->
<div class="form-group">
  <label for="typeChambre">🏨 Room Type:</label>
  <select
  id="typeChambre"
  name="typeChambre"
  [(ngModel)]="reservation.typeChambre"
  (change)="calculerPrixTotal()"
  required>
  <option value="" disabled selected>Select a room type</option>
  <option value="single">Single</option>
  <option value="Double">Double</option>
  <option value="Suite">Suite</option>
  <option value="Deluxe">Deluxe</option>
</select>

</div>
          <p><span class="label">💰 Total Price:</span> {{ reservation.prixTotal || 0 }} dt</p>
          <p style="color: darkorange; font-style: italic;">
            ⚠️ A 20% surcharge is applied for weekend nights (Friday, Saturday, Sunday).
          </p>
  
          <button 
            type="submit" 
            class="reserve-button" 
            [disabled]="!reservationForm.form.valid" 
            (click)="modifierReservation()"> 💾 Save Changes
          </button>
        </form>
      </div>
    </div>
  </div>
  
  <div *ngIf="!reservation" class="loading">
    <p>⏳ Loading reservation information...</p>
  </div>
