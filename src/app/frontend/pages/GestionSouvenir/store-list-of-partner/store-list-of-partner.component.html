<div class="store-container">
  <!-- Titre des stores validés -->
  <h2 class="section-title valid-title">✅ valid Stores</h2>
  <div class="store-grid">
    <div class="brutalist-card valid" *ngFor="let store of storesValides">
      <div class="brutalist-card__header">
        <div class="brutalist-card__icon">
          <!-- <i class="fas fa-store"></i> Icone de magasin -->
          <svg
            width="64px"
            height="64px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            stroke="#00ff04"
            stroke-width="0.00024000000000000003"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M5 3C3.89543 3 3 3.89543 3 5V6.83772L1.49006 11.3675C1.10052 12.5362 1.8474 13.7393 3 13.963V20C3 21.1046 3.89543 22 5 22H9H10H14H15H19C20.1046 22 21 21.1046 21 20V13.963C22.1526 13.7393 22.8995 12.5362 22.5099 11.3675L21 6.83772V5C21 3.89543 20.1046 3 19 3H5ZM15 20H19V14H17.5H12H6.5H5V20H9V17C9 15.3431 10.3431 14 12 14C13.6569 14 15 15.3431 15 17V20ZM11 20H13V17C13 16.4477 12.5523 16 12 16C11.4477 16 11 16.4477 11 17V20ZM3.38743 12L4.72076 8H6.31954L5.65287 12H4H3.38743ZM7.68046 12L8.34713 8H11V12H7.68046ZM13 12V8H15.6529L16.3195 12H13ZM18.3471 12L17.6805 8H19.2792L20.6126 12H20H18.3471ZM19 5V6H16.5H12H7.5H5V5H19Z"
                fill="#00ff04"
              ></path>
            </g>
          </svg>
        </div>
        <div class="brutalist-card__alert">
          {{ store.name }}
        </div>
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Description:</span>
        {{ store.description }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Address 📍:</span>
        {{ store.address }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Phone 📞: </span>
        +216 {{ store.phone | phoneFormat }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__actions">
        <button
          class="icon-btn"
          aria-label="Consult sales"
          [routerLink]="['/store-sales', store.id]"
        >
          <i class="fas fa-chart-line"></i>
          <span class="tooltip">Consult Sales</span>
        </button>
        <button
          class="icon-btn"
          aria-label="Consult souvenirs"
          [routerLink]="['/souvenirListOfPartnerByStore', store.id]"
        >
          <i class="fas fa-tag"></i>
          <span class="tooltip">Consult Souvenirs</span>
        </button>

        <button
          class="icon-btn"
          aria-label="Modify"
          [routerLink]="['/editStore', store.id]"
        >
          <i class="fas fa-pencil"></i>
          <span class="tooltip">Edit</span>
        </button>

        <button
          class="icon-btn"
          aria-label="Delete"
          (click)="deletestore(store.id)"
        >
          <i class="fas fa-trash-alt"></i>
          <span class="tooltip">Delete</span>
        </button>
      </div>
    </div>
  </div>
  <h2 class="section-title pending-title">🕐 Stores LOADING</h2>
  <div class="store-grid">
    <div class="brutalist-card invalid" *ngFor="let store of storesInvalides">
      <div class="brutalist-card__header">
        <div class="brutalist-card__icon">
          <!-- <i class="fas fa-store"></i> Icone de magasin -->
          <svg
            width="24px"
            height="2 4px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            stroke="#00ff04"
            stroke-width="0.00024000000000000003"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M5 3C3.89543 3 3 3.89543 3 5V6.83772L1.49006 11.3675C1.10052 12.5362 1.8474 13.7393 3 13.963V20C3 21.1046 3.89543 22 5 22H9H10H14H15H19C20.1046 22 21 21.1046 21 20V13.963C22.1526 13.7393 22.8995 12.5362 22.5099 11.3675L21 6.83772V5C21 3.89543 20.1046 3 19 3H5ZM15 20H19V14H17.5H12H6.5H5V20H9V17C9 15.3431 10.3431 14 12 14C13.6569 14 15 15.3431 15 17V20ZM11 20H13V17C13 16.4477 12.5523 16 12 16C11.4477 16 11 16.4477 11 17V20ZM3.38743 12L4.72076 8H6.31954L5.65287 12H4H3.38743ZM7.68046 12L8.34713 8H11V12H7.68046ZM13 12V8H15.6529L16.3195 12H13ZM18.3471 12L17.6805 8H19.2792L20.6126 12H20H18.3471ZM19 5V6H16.5H12H7.5H5V5H19Z"
                fill="#00ff04"
              ></path>
            </g>
          </svg>
        </div>
        <div class="brutalist-card__alert">
          {{ store.name }}
        </div>
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Description:</span>
        {{ store.description }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Address 📍:</span>
        {{ store.address }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__message">
        <span class="info-label">Phone 📞: </span>
        +216 {{ store.phone | phoneFormat }}
        <!-- Affichage de la description du store -->
      </div>
      <div class="brutalist-card__actions">
        <!-- New Consult Sales button -->
        <button
          class="icon-btn"
          aria-label="Consult sales"
          [routerLink]="['/store-sales', store.id]"
        >
          <i class="fas fa-chart-line"></i>
          <span class="tooltip">Consult Sales</span>
        </button>
        <button
          class="icon-btn"
          aria-label="Consult souvenirs"
          [routerLink]="['/souvenirListOfPartnerByStore', store.id]"
        >
          <i class="fas fa-tag"></i>
          <span class="tooltip">Consult Souvenirs</span>
        </button>

        <button
          class="icon-btn"
          aria-label="Modify"
          [routerLink]="['/editStore', store.id]"
        >
          <i class="fas fa-pencil-alt"></i>
          <span class="tooltip">Edit</span>
        </button>

        <button
          class="icon-btn"
          aria-label="Delete"
          (click)="deletestore(store.id)"
        >
          <i class="fas fa-trash-alt"></i>
          <span class="tooltip">Delete</span>
        </button>
      </div>
    </div>
  </div>
</div>
