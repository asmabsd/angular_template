<div class="cards-container">
  <div class="header-section">
    <h2>Store Products</h2>
    <p class="subtitle">Discover our curated collection of memorabilia</p>
  </div>
  <div>
    <button class="btn-add" [routerLink]="['/addSouvenir', storeId]"  [queryParams]="{ from: 'souvenirListOfPartnerByStore' }">
      <i class="fas fa-plus me-2"></i> Add a souvenir
    </button>
  </div>
  <div class="cards-grid">
    <div
      class="souvenir-card"
      *ngFor="let souvenir of souvenirs"
      [ngClass]="{ 'out-of-stock': souvenir.status === 'OUT OF STOCK' }"
    >
      <div class="image-container">
        <img
          [src]="
            souvenir.photo
              ? 'http://localhost:8089/pidev/souvenir/images/' + souvenir.photo
              : '/src/assets/frontend/images/souvenir.jpg'
          "
          class="souvenir-photo"
          [alt]="souvenir.name || 'Photo souvenir'"
        />
        <div class="card-badge">{{ souvenir.category }}</div>
      </div>

      <div class="card-body">
        <div class="card-header">
          <h3 class="souvenir-name">{{ souvenir.name }}</h3>
          <p class="souvenir-price">{{ souvenir.price | currency : "EUR"}}</p>
        </div>

        <p class="souvenir-description">{{ souvenir.description }}</p>

        <!-- Modifiez la section du status indicator comme ceci -->
        <div class="stock-info">
          <div
            class="status-badge"
            [ngClass]="{ 'stock-out': souvenir.status === 'OUT OF STOCK' }"
          >
            <i class="fas fa-cubes"></i>
            <span>{{ souvenir.status }}</span>
          </div>

          <div
            class="quantity-badge"
            *ngIf="souvenir.status !== 'OUT OF STOCK'"
            [ngClass]="{
              'low-stock': souvenir.quantity < 10 && souvenir.quantity > 3,
              'critical-stock': souvenir.quantity <= 3 && souvenir.quantity > 0
            }"
          >
            <i class="fas fa-box-open"></i>
            <span>{{ souvenir.quantity }}</span>
          </div>
        </div>
        <div class="card-actions">
          <button
            class="btn edit-btn"
            [routerLink]="['/editSouvenir', souvenir.id]"
            [queryParams]="{ from: 'souvenirListOfPartnerByStore' }"
          >
            <i class="fas fa-edit"></i>
            Edit
          </button>
          <button class="btn delete-btn" (click)="deleteSouvenir(souvenir.id)">
            <i class="fas fa-trash"></i>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
