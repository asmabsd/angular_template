<div class="cards-container">
  <div class="header-section">
    <h2>Store Products</h2>
  </div>

  <div class="cards-grid">
    <div class="souvenir-card" *ngFor="let souvenir of souvenirs" 
         [ngClass]="{'out-of-stock': souvenir.status === 'OUT OF STOCK'}">
      
      <div class="card-body">
        <h3 class="souvenir-name">{{ souvenir.name }}</h3>
        <p class="souvenir-description">{{ souvenir.description }}</p>
        
        <div class="details-grid">
          <div class="detail-item">
            <i class="fas fa-tag"></i>
            <span>{{ souvenir.category }}</span>
          </div>
          <div class="detail-item">
            <i class="fas fa-coins"></i>
            <span>{{ souvenir.price | currency }}</span>
          </div>
          <div class="detail-item status-indicator" 
               [ngClass]="{'stock-out': souvenir.status === 'OUT OF STOCK'}">
            <i class="fas fa-cubes"></i>
            <span>{{ souvenir.status }}</span>
          </div>
        </div>
      </div>

      <div class="card-actions">
        <button class="cart-btn" 
                [disabled]="souvenir.status === 'OUT OF STOCK'">
          <i class="fas fa-cart-plus"></i>
          Ajouter au panier
        </button>
      </div>
    </div>
  </div>
</div>
