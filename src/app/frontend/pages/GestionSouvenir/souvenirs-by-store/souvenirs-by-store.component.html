<div class="cards-container">
  <div class="header-section">
    <h2>🛍️ Store Products</h2>
  </div>

  <div class="cards-grid">
    <div class="product-card" *ngFor="let souvenir of souvenirs" 
         [ngClass]="{'out-of-stock': souvenir.status === 'OUT OF STOCK'}">

      <!-- Image Section -->
      <div class="card-image">
        <span class="badge" *ngIf="souvenir.status !== 'OUT OF STOCK'">🆕 New Release</span>
        <img [src]="souvenir.photo ? 'http://localhost:8089/pidev/souvenir/images/' + souvenir.photo : '/src/assets/frontend/images/souvenir.jpg'"
             alt="{{ souvenir.name || 'Photo souvenir' }}" />
        <button class="favorite-btn" title="Ajouter aux favoris">❤️</button>
      </div>

      <!-- Body -->
      <div class="card-body">
        <span class="category">{{ souvenir.category.toUpperCase() }}</span>
        <h3 class="souvenir-name">{{ souvenir.name }}</h3>

        <p class="description">
          {{ souvenir.description }}
        </p>

        <div class="features">
          <span class="price-tag">💰 {{ souvenir.price | currency }}</span>
          <span class="stock-status" 
                [ngClass]="{'in-stock': souvenir.status === 'IN STOCK', 'out-stock': souvenir.status === 'OUT OF STOCK'}">
            📦 {{ souvenir.status }}
          </span>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <button class="add-to-cart" (click)="addToPanel(souvenir)" 
                [disabled]="souvenir.status === 'OUT OF STOCK'">
          🛒 Add To Panel
        </button>
      </div>
    </div>
  </div>
</div>
